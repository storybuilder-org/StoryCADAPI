- uid: StoryCADLib.Services.API.StoryCADApi.CreateEmptyOutline(System.String,System.String,System.String)
  commentId: M:StoryCADLib.Services.API.StoryCADApi.CreateEmptyOutline(System.String,System.String,System.String)
  id: CreateEmptyOutline(System.String,System.String,System.String)
  parent: StoryCADLib.Services.API.StoryCADApi
  langs:
  - csharp
  - vb
  name: CreateEmptyOutline(string, string, string)
  nameWithType: StoryCADApi.CreateEmptyOutline(string, string, string)
  fullName: StoryCADLib.Services.API.StoryCADApi.CreateEmptyOutline(string, string, string)
  type: Method
  assemblies:
  - StoryCADLib
  namespace: StoryCADLib.Services.API
  summary: >-
    Creates a new empty story outline based on a template.

    Parameters:

    filePath - full path to the file that will back the outline

    name - the name to use for the outline's Overview element

    author - the author name for the overview

    templateIndex - index (as a string) specifying the template to use

    Returns a JSON-serialized OperationResult payload containing a list of the StoryElement Guids.
  example: []
  syntax:
    content: public Task<OperationResult<List<Guid>>> CreateEmptyOutline(string name, string author, string templateIndex)
    parameters:
    - id: name
      type: System.String
    - id: author
      type: System.String
    - id: templateIndex
      type: System.String
    return:
      type: System.Threading.Tasks.Task{StoryCADLib.Services.API.OperationResult{System.Collections.Generic.List{System.Guid}}}
    content.vb: Public Function CreateEmptyOutline(name As String, author As String, templateIndex As String) As Task(Of OperationResult(Of List(Of Guid)))
