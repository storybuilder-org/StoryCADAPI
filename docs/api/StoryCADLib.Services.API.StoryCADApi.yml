  - csharp
  - vb
  name: UpdateElementProperties(Guid, Dictionary<string, object>)
  nameWithType: StoryCADApi.UpdateElementProperties(Guid, Dictionary<string, object>)
  fullName: StoryCADLib.Services.API.StoryCADApi.UpdateElementProperties(System.Guid, System.Collections.Generic.Dictionary<string, object>)
  type: Method
  assemblies:
  - StoryCADLib
  namespace: StoryCADLib.Services.API
  summary: >-
    Updates specified properties for a story element identified by its GUID.

    A dictionary is used to specify the properties to update, where keys are

    property names and values are the new values.

    Iterates over each property in the dictionary and calls UpdateElementProperty.
  example: []
  syntax:
    content: public OperationResult<bool> UpdateElementProperties(Guid elementGuid, Dictionary<string, object> properties)
    parameters:
    - id: elementGuid
      type: System.Guid
      description: The GUID of the story element to update.
    - id: properties
      type: System.Collections.Generic.Dictionary{System.String,System.Object}
      description: A Dictionary where keys are property names and values are the new values.
    return:
      type: StoryCADLib.Services.API.OperationResult{System.Boolean}
      description: void if all properties are updated successfully, exception otherwise.
    content.vb: Public Function UpdateElementProperties(elementGuid As Guid, properties As Dictionary(Of String, Object)) As OperationResult(Of Boolean)
