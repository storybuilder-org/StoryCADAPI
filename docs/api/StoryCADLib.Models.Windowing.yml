- uid: StoryCADLib.Models.Windowing.XamlRoot
  commentId: F:StoryCADLib.Models.Windowing.XamlRoot
  id: XamlRoot
  parent: StoryCADLib.Models.Windowing
  langs:
  - csharp
  - vb
  name: XamlRoot
  nameWithType: Windowing.XamlRoot
  fullName: StoryCADLib.Models.Windowing.XamlRoot
  type: Field
  assemblies:
  - StoryCADLib
  namespace: StoryCADLib.Models
  summary: >-
    A defect in early WinUI 3 Win32 code is that ContentDialog

    controls don't have an established XamlRoot. A workaround

    is to assign the dialog's XamlRoot to the root of a visible

    Page. The Shell page's XamlRoot is stored here and accessed wherever needed.
  example: []
  syntax:
    content: public XamlRoot XamlRoot
    return:
      type: Microsoft.UI.Xaml.XamlRoot
    content.vb: Public XamlRoot As XamlRoot
