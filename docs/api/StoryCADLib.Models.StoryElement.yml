- uid: StoryCADLib.Models.StoryElement.GetByGuid(System.Guid,StoryCADLib.Models.StoryModel)
  commentId: M:StoryCADLib.Models.StoryElement.GetByGuid(System.Guid,StoryCADLib.Models.StoryModel)
  id: GetByGuid(System.Guid,StoryCADLib.Models.StoryModel)
  parent: StoryCADLib.Models.StoryElement
  langs:
  - csharp
  - vb
  name: GetByGuid(Guid, StoryModel)
  nameWithType: StoryElement.GetByGuid(Guid, StoryModel)
  fullName: StoryCADLib.Models.StoryElement.GetByGuid(System.Guid, StoryCADLib.Models.StoryModel)
  type: Method
  assemblies:
  - StoryCADLib
  namespace: StoryCADLib.Models
  summary: >-
    Retrieve a StoryElement from its Guid.

    Guids are used as keys to StoryElements, stored in

    the StoryModel's StoryElementCollection. They also

    identify links from one StoryElement to another,

    such as the Setting or a cast member Character in

    a Scene. We use Guid.Empty as the value for such a

    link  until it's assigned.

    These placeholder links are often expected to be a

    StoryElement key, such as to display the name of

    the setting on the Scene Content pane. Treating

    Guid.Empty as an 'Undefined' StoryElement, with

    a blank name, simplifies that code.
  example: []
  syntax:
    content: public static StoryElement GetByGuid(Guid guid, StoryModel storyModel = null)
    parameters:
    - id: guid
      type: System.Guid
      description: The Guid of the StoryElement to retrieve
    - id: storyModel
      type: StoryCADLib.Models.StoryModel
      description: optional story model override, defaults to current app state model.
    return:
      type: StoryCADLib.Models.StoryElement
      description: ''
    content.vb: Public Shared Function GetByGuid(guid As Guid, storyModel As StoryModel = Nothing) As StoryElement
  overload: StoryCADLib.Models.StoryElement.GetByGuid*
