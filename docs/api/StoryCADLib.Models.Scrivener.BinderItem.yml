  name: GetEnumerator()
  nameWithType: BinderItem.GetEnumerator()
  fullName: StoryCADLib.Models.Scrivener.BinderItem.GetEnumerator()
  type: Method
  assemblies:
  - StoryCADLib
  namespace: StoryCADLib.Models.Scrivener
  summary: >-
    This method allows a dept-first search (DFS) or 'pre-order traversal' of

    a of a BinderItem tree or subtree with a simple C# foreach.

    In a DFS, you visit the root first and then search deeper into the tree

    visiting each node and then the node’s children.

    To use the enumerator, you code a foreach loop anywhere in your program:

    foreach (TreeNode node in root)

    {

    //perform action on node in DFS order here

    }

    ref: http://www.timlabonne.com/2013/07/performing-a-dfs-over-a-rooted-tree-with-a-c-foreach-loop/
  example: []
  syntax:
    content: public IEnumerator<BinderItem> GetEnumerator()
    return:
      type: System.Collections.Generic.IEnumerator{StoryCADLib.Models.Scrivener.BinderItem}
      description: BinderItem for current node, then for each child in a loop
    content.vb: Public Function GetEnumerator() As IEnumerator(Of BinderItem)
