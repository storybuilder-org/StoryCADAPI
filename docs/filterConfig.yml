# API filter configuration for docfx
# Excludes internal implementation details from public documentation

apiRules:
  # Exclude internal namespaces
  - exclude:
      uidRegex: ^StoryCADLib\.Internal
      type: Namespace

  # Exclude private and internal members
  - exclude:
      hasAttribute:
        uid: System.Runtime.CompilerServices.InternalsVisibleToAttribute
      type: Member

  # Include all public API
  - include:
      uidRegex: ^StoryCADLib
      type: Namespace
