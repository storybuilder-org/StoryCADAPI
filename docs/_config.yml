# Jekyll + Just the Docs configuration for the StoryCAD API documentation.
# Built and deployed to GitHub Pages by .github/workflows/deploy-docs.yml.
title: StoryCAD API
description: Build story outlines programmatically with the StoryCADLib API.
lang: en-US

# Project site published at https://storybuilder-org.github.io/StoryCADAPI/
url: https://storybuilder-org.github.io
baseurl: /StoryCADAPI

theme: just-the-docs

# Sidebar / navigation
nav_enabled: true
heading_anchors: true

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Top-right auxiliary links
aux_links:
  "StoryCADAPI on GitHub":
    - "https://github.com/storybuilder-org/StoryCADAPI"
aux_links_new_tab: true

# Footer
footer_content: 'StoryBuilder Foundation &mdash; released under the <a href="https://www.gnu.org/licenses/gpl-3.0.en.html">GNU GPL v3</a>.'
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y"

# "Edit this page on GitHub" links
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/storybuilder-org/StoryCADAPI"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

color_scheme: light

plugins:
  - jekyll-seo-tag
  - jekyll-relative-links

# jekyll-relative-links rewrites in-page [text](page.md) links to their built URLs.
relative_links:
  enabled: true
  collections: false

# Don't let Jekyll try to process leftover build output or tooling files.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
  - serve-docs.ps1
