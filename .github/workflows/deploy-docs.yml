name: Build Documentation

# Build-only workflow for now - deploy step commented out until ready to go live
# To enable deployment:
# 1. Uncomment the deploy job
# 2. Enable GitHub Pages in repo settings (Settings > Pages > Source: GitHub Actions)
# 3. Change trigger to include push to main

on:
  # Manual trigger only until ready to deploy
  workflow_dispatch:

  # Uncomment to auto-build on push:
  # push:
  #   branches: [main, dev]
  #   paths:
  #     - 'docs/**'
  #     - 'samples/**'
  #     - '.github/workflows/deploy-docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout StoryCADAPI
        uses: actions/checkout@v4

      - name: Checkout StoryCAD (for API metadata)
        uses: actions/checkout@v4
        with:
          repository: storybuilder-org/StoryCAD
          path: StoryCAD
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install docfx
        run: dotnet tool install -g docfx

      - name: Build documentation
        working-directory: docs
        run: docfx docfx.json

      - name: List generated files
        run: |
          echo "=== Generated site structure ==="
          find docs/_site -type f | head -50

      # Upload artifact for inspection (even without deployment)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/_site
          retention-days: 7

      # Uncomment below when ready to deploy to GitHub Pages
      # - name: Setup Pages
      #   uses: actions/configure-pages@v4

      # - name: Upload pages artifact
      #   uses: actions/upload-pages-artifact@v3
      #   with:
      #     path: docs/_site

